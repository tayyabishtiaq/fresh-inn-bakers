/* ================= SUPABASE CONFIG ================= */
const SUPABASE_URL = "https://rziajrwhyhlybuelkwgd.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_-jHp0n64Bl3HWv1GMkBsww_-4Lxd6UVY";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

/* ================= PRODUCT DATA (fallback until Supabase is configured) ================= */
let PRODUCTS = [
  {id:'c1',name:'Classic Chocolate Cake',desc:'Rich chocolate sponge — sample item',price:1200,category:'Cakes',popular:true,available:true},
  {id:'c2',name:'Fresh Cream Cake',desc:'Light cream layers — sample item',price:1400,category:'Cakes',popular:true,available:true},

  {id:'b2',name:'Assorted Biscuits',desc:'Sample item',price:350,category:'Biscuits & Cookies',popular:false,available:true},
  {id:'br1',name:'Sliced Bread',desc:'Sample item',price:180,category:'Breads',popular:true,available:true},
  {id:'br2',name:'Bun Pack',desc:'Sample item',price:150,category:'Breads',popular:false,available:false},
  {id:'d1',name:'Trifle Pudding',desc:'Sample item',price:300,category:'Desserts',popular:false,available:true},
  {id:'d2',name:'Fruit Tart',desc:'Sample item',price:250,category:'Desserts',popular:false,available:true},
  {id:'s1',name:'Chicken Patties (6pc)',desc:'Sample item',price:500,category:'Snacks',popular:true,available:true},
  {id:'s2',name:'Vegetable Rolls',desc:'Sample item',price:300,category:'Snacks',popular:false,available:true},
  {id:'sw1',name:'Assorted Sweets Box',desc:'Sample item',price:600,category:'Sweets',popular:false,available:true},
  {id:'bv1',name:'Soft Drink 500ml',desc:'Sample item',price:120,category:'Beverages',popular:false,available:true},
  {id:'bv2',name:'Fresh Juice',desc:'Sample item',price:250,category:'Beverages',popular:false,available:true},
];
let CATEGORIES = [...new Set(PRODUCTS.map(p=>p.category))];

async function loadProductsFromSupabase(){
  if(SUPABASE_URL.startsWith('YOUR_') || SUPABASE_PUBLISHABLE_KEY.startsWith('YOUR_')) return;
  const { data, error } = await supabaseClient.from('products').select('*').order('created_at',{ascending:false});
  if(error){ console.warn('Supabase products:', error.message); return; }
  if(Array.isArray(data) && data.length){ PRODUCTS = data.map(p => ({
    id:p.id, name:p.name, desc:p.description || '', price:Number(p.price || 0), category:p.category || 'Other',
    popular:!!p.popular, featured:!!p.featured, available:!!p.available, image:p.image_url || '',
    discount:Number(p.discount_percent || 0), stock:Number(p.stock_quantity || 0)
  })); CATEGORIES = [...new Set(PRODUCTS.map(p=>p.category))]; render(); }
}
const CAKE_TILES = ['Birthday Cakes','Chocolate Cakes','Cream Cakes','Customized Cakes','Celebration Cakes'];
const GALLERY_TILES = ['Cakes','Pastries','Bakery items','Store interior','Desserts','More photos'];

/* ================= STATE ================= */
let cart = JSON.parse(localStorage.getItem('fib_cart') || '[]');
let lastOrder = JSON.parse(sessionStorage.getItem('fib_last_order') || 'null');
function saveCart(){ localStorage.setItem('fib_cart', JSON.stringify(cart)); updateCartCount(); }
function updateCartCount(){ document.getElementById('cartCount').textContent = cart.reduce((s,i)=>s+i.qty,0); }
function addToCart(id, qty){
  qty = qty || 1;
  const existing = cart.find(i=>i.id===id);
  if(existing){ existing.qty += qty; } else {
    const p = PRODUCTS.find(p=>p.id===id);
    cart.push({id:p.id,name:p.name,price:p.price,qty});
  }
  saveCart(); render();
}
function changeQty(id, delta){
  const item = cart.find(i=>i.id===id); if(!item) return;
  item.qty += delta;
  if(item.qty <= 0) cart = cart.filter(i=>i.id!==id);
  saveCart(); render();
}
function removeFromCart(id){ cart = cart.filter(i=>i.id!==id); saveCart(); render(); }
function clearCart(){ cart = []; saveCart(); render(); }
function cartSubtotal(){ return cart.reduce((s,i)=>s+i.price*i.qty,0); }

function waLink(message){ return `https://wa.me/${BAKERY_WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= OPEN/CLOSED (Asia/Karachi) ================= */
function getKarachiHourMinute(){
  const parts = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Karachi',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const h = parseInt(parts.find(p=>p.type==='hour').value,10);
  const m = parseInt(parts.find(p=>p.type==='minute').value,10);
  return {h,m};
}
function statusBadge(){
  const {h} = getKarachiHourMinute();
  const isOpen = h >= 7 || h < 1;
  const cls = isOpen ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
  const label = isOpen ? '🟢 Open Now' : '🔴 Closed Now';
  const sub = isOpen ? 'Open today until 1:00 AM' : 'Opens today at 7:00 AM';
  return `<div class="inline-flex flex-col gap-1"><span class="inline-block ${cls} text-sm font-semibold px-3 py-1 rounded-full w-fit">${label}</span><span class="text-xs text-brown2">${sub}</span></div>`;
}

/* ================= PAGE RENDERERS ================= */
function productCard(p){
  const finalPrice = p.discount ? Math.round(p.price * (1 - p.discount/100)) : p.price;
  const image = p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" class="w-full h-full object-cover" loading="lazy">`
                        : `<div class="w-full h-full bg-gradient-to-br from-cream2 to-goldl flex items-center justify-center text-4xl">🍰</div>`;
  return `<div class="bg-paper border border-brown/10 rounded-2xl overflow-hidden flex flex-col shadow-sm">
    <div class="aspect-[4/3] overflow-hidden relative">${image}${p.discount ? `<span class="absolute top-3 left-3 bg-red-600 text-white text-xs font-bold px-2 py-1 rounded-full">${p.discount}% OFF</span>` : ''}</div>
    <div class="p-4 flex flex-col gap-1 flex-1">
      <h3 class="font-semibold">${esc(p.name)}</h3>
      <p class="text-sm text-brown2 flex-1">${esc(p.desc)}</p>
      ${!p.available ? '<span class="text-xs font-semibold text-red-600">Currently unavailable</span>' : ''}
      <div class="flex items-center justify-between mt-2">
        <span class="font-semibold text-gold">Rs. ${finalPrice.toLocaleString()}${p.discount ? ` <del class="text-xs text-gray-500">Rs. ${p.price.toLocaleString()}</del>` : ''}</span>
        <div class="flex items-center gap-2">
          <input type="number" min="1" value="1" id="qty-${p.id}" class="w-14 border border-brown/20 rounded-lg px-2 py-1 text-sm" ${!p.available?'disabled':''}>
          <button ${!p.available?'disabled':''} onclick="addToCart('${p.id}', parseInt(document.getElementById('qty-${p.id}').value)||1)" class="bg-brown text-cream text-sm font-semibold px-3 py-2 rounded-full disabled:opacity-40">Add</button>
        </div>
      </div>
    </div>
  </div>`;
}

function pageHome(){
  return `
  <section class="max-w-6xl mx-auto px-5 pt-12 pb-8 grid lg:grid-cols-2 gap-10 items-center">
    <div>
      <h1 class="font-serif text-4xl sm:text-5xl font-bold leading-tight">Freshly Baked.<br>Made With Love.</h1>

    </div>
    <div class="aspect-[4/5] rounded-3xl bg-gradient-to-br from-gold to-brown2 flex items-center justify-center text-8xl text-white shadow-xl">🎂</div>
  </section>
  <section class="max-w-6xl mx-auto px-5 py-10">
    <h2 class="font-serif text-2xl font-semibold mb-4">Popular right now</h2>

function pageMenu(){
  setTimeout(bindMenuControls, 0);
  return `
  <section class="max-w-6xl mx-auto px-5 pt-10 pb-16">
    <h1 class="font-serif text-3xl font-bold mb-2">Our Menu</h1>
    <p class="text-brown2 mb-6">Fresh products and prices are updated from our store.</p>
    <div class="flex flex-wrap gap-3 mb-6">
      <input id="mSearch" type="text" placeholder="Search products..." class="border border-brown/20 rounded-full px-4 py-2 text-sm flex-1 min-w-[180px]">
      <select id="mCategory" class="border border-brown/20 rounded-full px-4 py-2 text-sm"><option value="">All categories</option>${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      <select id="mSort" class="border border-brown/20 rounded-full px-4 py-2 text-sm">
        <option value="default">Sort: default</option>
        <option value="priceAsc">Price: low to high</option>
        <option value="priceDesc">Price: high to low</option>
        <option value="popular">Popular first</option>
      </select>
      <label class="flex items-center gap-2 text-sm border border-brown/20 rounded-full px-4 py-2"><input id="mAvail" type="checkbox"> In stock only</label>
    </div>
    <div id="menuResults" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </section>`;
}
function bindMenuControls(){
  const search = document.getElementById('mSearch'), cat = document.getElementById('mCategory'), sort = document.getElementById('mSort'), avail = document.getElementById('mAvail');
  function run(){
    let list = PRODUCTS.filter(p =>
      (!search.value || p.name.toLowerCase().includes(search.value.toLowerCase())) &&
      (!cat.value || p.category === cat.value) &&
      (!avail.checked || p.available)
    );
    if(sort.value==='priceAsc') list.sort((a,b)=>a.price-b.price);
    if(sort.value==='priceDesc') list.sort((a,b)=>b.price-a.price);
    if(sort.value==='popular') list.sort((a,b)=>(b.popular?1:0)-(a.popular?1:0));
    document.getElementById('menuResults').innerHTML = list.length ? list.map(productCard).join('') : '<p class="text-brown2 col-span-full">No products match your filters.</p>';
  }
  [search,cat,sort,avail].forEach(el=>el.addEventListener('input', run));
  run();
}

  return `

}
function bindCakeForm(){
  const form = document.getElementById('cakeForm'); if(!form) return;
  form.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(form);
    const name=f.get('name'), phone=f.get('phone');
    if(!name || !phone){ document.getElementById('cakeError').classList.remove('hidden'); return; }
    document.getElementById('cakeError').classList.add('hidden');
    const msg = `Assalam o Alaikum Fresh Inn Bakers, I would like to request a custom cake.\n\nName: ${name}\nPhone: ${phone}\nCake Type: ${f.get('type')||'-'}\nSize: ${f.get('size')}\nFlavor: ${f.get('flavor')||'-'}\nMessage on Cake: ${f.get('message')||'-'}\nPreferred Date: ${f.get('date')||'-'}\nPreferred Time: ${f.get('time')||'-'}\nAdditional Requirements: ${f.get('notes')||'-'}`;
    window.open(waLink(msg), '_blank');
  });
}

const call = BAKERY_PHONE_NUMBER
? `<a href="tel:${BAKERY_PHONE_NUMBER}" class="bg-gold text-white font-semibold px-5 py-3 rounded-full">Call Now</a>`
    : `<button onclick="alert('Phone number coming soon — please use WhatsApp to order.')" class="bg-gold/60 text-white font-semibold px-5 py-3 rounded-full">Phone number coming soon</button>`;

  return `<section class="max-w-6xl mx-auto px-5 py-14 grid lg:grid-cols-2 gap-8">
    <div class="bg-paper border border-brown/10 rounded-2xl p-6 sm:p-8">
      ${statusBadge()}
      <div class="mt-5 space-y-4 text-sm">
        <div><strong>Fresh Inn Bakers</strong><br>${esc(ADDRESS_TEXT)}</div>
        <div>🕐 Every day, 7:00 AM – 1:00 AM</div>
      </div>
      <div class="flex flex-wrap gap-3 mt-6">
        ${call}
        <a id="waContact" href="#" target="_blank" rel="noopener" class="border border-brown font-semibold px-5 py-3 rounded-full">WhatsApp Us</a>
        <a href="${MAPS_DIRECTIONS_URL}" target="_blank" rel="noopener" class="border border-brown font-semibold px-5 py-3 rounded-full">Get Directions</a>
        ${reviewBtn}
      </div>
    </div>
    <div class="rounded-2xl overflow-hidden border border-brown/10 min-h-[320px]">
      <iframe class="w-full h-full min-h-[320px]" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${encodeURIComponent(ADDRESS_TEXT)}&output=embed" title="Fresh Inn Bakers location map"></iframe>
    </div>
  </section>`;
}

function pageCart(){
  if(!cart.length){
    return `<section class="max-w-2xl mx-auto px-5 py-16 text-center">
      <h1 class="font-serif text-2xl font-bold mb-3">Your cart is empty</h1>
      <p class="text-brown2 mb-6">Add something delicious from the menu.</p>
      <a href="#/menu" class="bg-gold text-white font-semibold px-6 py-3 rounded-full">Browse Menu</a>
    </section>`;
  }
  const sub = cartSubtotal();
  return `<section class="max-w-2xl mx-auto px-5 py-12">
    <h1 class="font-serif text-2xl font-bold mb-6">Your Cart</h1>
    <div class="space-y-3">
      ${cart.map(i=>`<div class="flex items-center justify-between bg-paper border border-brown/10 rounded-xl p-4">
        <div><div class="font-semibold">${esc(i.name)}</div><div class="text-sm text-brown2">Rs. ${i.price.toLocaleString()} each</div></div>
        <div class="flex items-center gap-3">
          <button onclick="changeQty('${i.id}',-1)" class="w-8 h-8 rounded-full border border-brown/30">-</button>
          <span>${i.qty}</span>
          <button onclick="changeQty('${i.id}',1)" class="w-8 h-8 rounded-full border border-brown/30">+</button>
          <button onclick="removeFromCart('${i.id}')" class="text-red-600 text-sm ml-2">Remove</button>
        </div>
      </div>`).join('')}
    </div>
    <div class="mt-6 bg-paper border border-brown/10 rounded-xl p-5 space-y-2 text-sm">
      <div class="flex justify-between"><span>Subtotal</span><span>Rs. ${sub.toLocaleString()}</span></div>
      <div class="flex justify-between text-brown2"><span>Delivery fee (if delivery)</span><span>Rs. ${DELIVERY_FEE.toLocaleString()}</span></div>
      <div class="flex justify-between font-semibold text-base pt-2 border-t border-brown/10"><span>Total (pickup)</span><span>Rs. ${sub.toLocaleString()}</span></div>
    </div>
    <div class="flex gap-3 mt-6">
      <button onclick="clearCart()" class="border border-brown font-semibold px-5 py-3 rounded-full">Clear Cart</button>
      <a href="#/checkout" class="flex-1 text-center bg-gold text-white font-semibold px-5 py-3 rounded-full">Checkout</a>
    </div>
  </section>`;
}

function pageCheckout(){
  if(!cart.length) return `<section class="max-w-xl mx-auto px-5 py-16 text-center"><h1 class="font-serif text-2xl font-bold mb-3">Your cart is empty</h1><a href="#/menu" class="bg-gold text-white font-semibold px-6 py-3 rounded-full">Browse Menu</a></section>`;
  setTimeout(bindCheckout, 0);
  const sub = cartSubtotal();
  return `<section class="max-w-xl mx-auto px-5 py-12">
    <h1 class="font-serif text-2xl font-bold mb-6">Checkout</h1>
    <form id="checkoutForm" novalidate class="bg-paper border border-brown/10 rounded-2xl p-6 space-y-4">
      <div><label class="text-sm font-semibold block mb-1">Full Name *</label><input required name="name" class="w-full border border-brown/20 rounded-lg px-3 py-2"></div>
      <div><label class="text-sm font-semibold block mb-1">Phone Number *</label><input required name="phone" type="tel" class="w-full border border-brown/20 rounded-lg px-3 py-2"></div>
      <div>
        <label class="text-sm font-semibold block mb-1">Order Type *</label>
        <div class="flex gap-4 text-sm">
          <label class="flex items-center gap-2"><input type="radio" name="orderType" value="Pickup" checked> Pickup</label>
          <label class="flex items-center gap-2"><input type="radio" name="orderType" value="Delivery"> Delivery</label>
        </div>
      </div>
      <div id="addressField" class="hidden"><label class="text-sm font-semibold block mb-1">Delivery Address *</label><textarea name="address" class="w-full border border-brown/20 rounded-lg px-3 py-2" rows="2"></textarea></div>
      <div><label class="text-sm font-semibold block mb-1">Special Instructions</label><textarea name="notes" class="w-full border border-brown/20 rounded-lg px-3 py-2" rows="2"></textarea></div>
      <p id="checkoutError" class="text-sm text-red-600 hidden"></p>
      <div class="bg-cream rounded-lg p-4 text-sm space-y-1">
        <div class="flex justify-between"><span>Subtotal</span><span>Rs. ${sub.toLocaleString()}</span></div>
        <div class="flex justify-between" id="ckDeliveryRow" style="display:none"><span>Delivery fee</span><span>Rs. ${DELIVERY_FEE.toLocaleString()}</span></div>
        <div class="flex justify-between font-semibold pt-1 border-t border-brown/10"><span>Total</span><span id="ckTotal">Rs. ${sub.toLocaleString()}</span></div>
      </div>
      <button type="submit" class="w-full bg-gold text-white font-semibold py-3 rounded-full">Send Order on WhatsApp</button>
    </form>
  </section>`;
}
function bindCheckout(){
  const form = document.getElementById('checkoutForm'); if(!form) return;
  const addressField = document.getElementById('addressField');
  const deliveryRow = document.getElementById('ckDeliveryRow');
  const totalEl = document.getElementById('ckTotal');
  const sub = cartSubtotal();
  function syncType(){
    const type = form.orderType.value;
    if(type==='Delivery'){ addressField.classList.remove('hidden'); form.address.required = true; deliveryRow.style.display='flex'; totalEl.textContent = 'Rs. ' + (sub+DELIVERY_FEE).toLocaleString(); }
    else { addressField.classList.add('hidden'); form.address.required = false; deliveryRow.style.display='none'; totalEl.textContent = 'Rs. ' + sub.toLocaleString(); }
  }
  form.querySelectorAll('input[name=orderType]').forEach(r=>r.addEventListener('change', syncType));
  syncType();
  form.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(form);
    const name=f.get('name'), phone=f.get('phone'), type=f.get('orderType'), address=f.get('address'), notes=f.get('notes');
    const err = document.getElementById('checkoutError');
    if(!name || !phone || (type==='Delivery' && !address)){
      err.textContent = 'Please fill in all required fields' + (type==='Delivery' ? ' including delivery address.' : '.');
      err.classList.remove('hidden'); return;
    }
    err.classList.add('hidden');
    const total = type==='Delivery' ? sub+DELIVERY_FEE : sub;
    const orderNumber = 'FIB-' + Date.now().toString().slice(-6);
    const itemsText = cart.map(i=>`${i.name} x${i.qty}`).join('\n');
    const msg = `Assalam o Alaikum Fresh Inn Bakers, I want to place an order.\n\nOrder #: ${orderNumber}\nCustomer: ${name}\nPhone: ${phone}\n\nOrder:\n${itemsText}\n\nOrder Type: ${type}\n${type==='Delivery' ? 'Address: '+address+'\n' : ''}Special Instructions: ${notes || '-'}\n\nTotal: Rs. ${total.toLocaleString()}`;
    lastOrder = {orderNumber, name, total, type, items: cart.map(i=>({name:i.name,qty:i.qty}))};
    sessionStorage.setItem('fib_last_order', JSON.stringify(lastOrder));
    window.open(waLink(msg), '_blank');
    cart = []; saveCart();
    location.hash = '#/confirmation';
  });
}

function pageConfirmation(){
  if(!lastOrder) return `<section class="max-w-xl mx-auto px-5 py-16 text-center"><h1 class="font-serif text-2xl font-bold mb-3">No recent order found</h1><a href="#/menu" class="bg-gold text-white font-semibold px-6 py-3 rounded-full">Browse Menu</a></section>`;
  return `<section class="max-w-xl mx-auto px-5 py-16 text-center">
    <div class="text-5xl mb-4">✅</div>
    <h1 class="font-serif text-2xl font-bold mb-2">Order Request Sent!</h1>
    <p class="text-brown2 mb-6">Your order request has been prepared. Please confirm your order with Fresh Inn Bakers through WhatsApp.</p>
    <div class="bg-paper border border-brown/10 rounded-2xl p-6 text-left text-sm space-y-2 mb-6">
      <div class="flex justify-between"><span>Order Number</span><strong>${lastOrder.orderNumber}</strong></div>
      <div class="flex justify-between"><span>Customer</span><strong>${esc(lastOrder.name)}</strong></div>
      <div class="flex justify-between"><span>Order Type</span><strong>${lastOrder.type}</strong></div>
      <div class="flex justify-between"><span>Order Total</span><strong>Rs. ${lastOrder.total.toLocaleString()}</strong></div>
      <div class="pt-2 border-t border-brown/10"><span class="font-semibold">Items</span><ul class="list-disc ml-5 mt-1">${lastOrder.items.map(i=>`<li>${esc(i.name)} x${i.qty}</li>`).join('')}</ul></div>
    </div>
    <div class="flex gap-3 justify-center flex-wrap">
      <a href="#/menu" class="border border-brown font-semibold px-5 py-3 rounded-full">Continue Shopping</a>
      <a href="${waLink('Hi Fresh Inn Bakers, following up on order '+lastOrder.orderNumber)}" target="_blank" rel="noopener" class="bg-gold text-white font-semibold px-5 py-3 rounded-full">Contact Bakery</a>
    </div>
  </section>`;
}

/* ================= ROUTER ================= */
const ROUTES = { home:pageHome, menu:pageMenu, cakes:pageCakes, about:pageAbout, gallery:pageGallery, contact:pageContact, cart:pageCart, checkout:pageCheckout, confirmation:pageConfirmation };
function render(){
  const route = (location.hash.replace('#/','') || 'home').split('?')[0];
  const fn = ROUTES[route] || pageHome;
  document.getElementById('app').innerHTML = fn();
  document.getElementById('mobileNav').classList.add('hidden');
  window.scrollTo({top:0});
  updateCartCount();
  bindCakeForm();
  const waMsg = 'Hi Fresh Inn Bakers, I would like to inquire about your products.';
  document.getElementById('waFloat').href = waLink(waMsg);
  const waContact = document.getElementById('waContact'); if(waContact) waContact.href = waLink(waMsg);
}
window.addEventListener('hashchange', render);
document.getElementById('menuToggle').addEventListener('click', ()=>document.getElementById('mobileNav').classList.toggle('hidden'));
setInterval(()=>{ 
  if((location.hash.replace('#/','')||'home')==='home' || 
     (location.hash.replace('#/','')||'')==='contact') render(); 
}, 60000);

render();
loadProductsFromSupabase();
</script>
